<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Carrito de compras (línea) -->
  <g fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Asa superior del carrito -->
    <path d="M18 20 L22 20 L28 42 L50 42 L54 28 L24 28" />
    <!-- Rueda izquierda -->
    <circle cx="26" cy="48" r="3" />
    <!-- Rueda derecha -->
    <circle cx="46" cy="48" r="3" />
